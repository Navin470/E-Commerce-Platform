apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: ecommerce
spec:
  type: NodePort
  selector:
    app: auth-service
  ports:
    - protocol: TCP
      port: 80         # Port accessible within the cluster (ClusterIP)
      targetPort: 3002 # Port the application is listening on inside the container
      nodePort: 5002   # External port accessible via the Worker Node IP