apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: ecommerce
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-container
        image: navin1199/auth-service:16
        ports:
        - containerPort: 5002
        env:
          # 1. Get User from Secret
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: auth-service-secrets
                key: POSTGRES_USER
          
          # 2. Get Password from Secret
          - name: DB_PASS
            valueFrom:
              secretKeyRef:
                name: auth-service-secrets
                key: POSTGRES_PASSWORD

          # 3. Get Secret Key for JWT (matches os.getenv("JWT_SECRET"))
          - name: JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: auth-service-secrets
                key: JWT_SECRET

          # 4. Construct DATABASE_URL for SQLAlchemy (matches os.getenv("DATABASE_URL"))
          - name: DATABASE_URL
            value: "postgresql://$(DB_USER):$(DB_PASS)@auth-db:5432/auth_db"
                    # postgresql://$(DB_USER):$(DB_PASS)@auth-db:5432/auth-db
        # Pulls remaining non-sensitive info from ConfigMap
        envFrom:
        - configMapRef:
            name: auth-service-config
            
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: ecommerce
spec:
  type: NodePort           # Changed from ClusterIP to NodePort
  selector:
    app: auth-service
  ports:
    - protocol: TCP
      port: 5002             # Internal Service Port
      targetPort: 5002     # Must match your Flask app containerPort
      nodePort: 32000     # Optional: You can specify a port between 30000-32767