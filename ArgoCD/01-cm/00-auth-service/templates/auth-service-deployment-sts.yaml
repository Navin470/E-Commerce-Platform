apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: ecommerce
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-container
        # Replace with your actual Docker Hub image created in your Jenkins pipeline
        image: navin1199/auth-service:16
        ports:
        - containerPort: 3002
        envFrom:
        - configMapRef:
            name: auth-service-config
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: ecommerce
spec:
  type: NodePort
  selector:
    app: auth-service
  ports:
    - protocol: TCP
      port: 80         # Port accessible within the cluster (ClusterIP)
      targetPort: 5002 # Port the application is listening on inside the container
      nodePort: 30002   # External port accessible via the Worker Node IP