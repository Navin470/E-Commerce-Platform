apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend
  namespace: argocd
spec:
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  source:
    repoURL: 'https://github.com/Navin470/E-Commerce-Platform.git'
    path: ArgoCD/01-cm/03-frontend-service
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: ecommerce